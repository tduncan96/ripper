<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rip Status</title>
        <style>
        body {
            margin: 0;
            padding: 1rem;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            line-height: 1.4;
        }
        .bar {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 22px;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            margin: 4px 0 12px 0;
        }
        .bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #0eb64c;
            transition: width 0.5s ease;
            border-radius: 3px 0 0 3px;
        }
        .bar-fill.move {
            background: #60a5fa;
        }
        .bar-overflow {
            position: absolute;
            top: 0;
            left: 100%;
            height: 100%;
            background: #f87171;
            transition: width 0.5s ease;
            border-radius: 0 3px 3px 0;
            width: 0;
        }
        .bar-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 0 0 2px #000;
            font-size: 12px;
            z-index: 1;
        }
        .subtitle {
            display: block;
            font-size: 0.7em;
            font-weight: normal;
            font-style: italic;
            color: #666;
        }
        .status {
            font-style: italic;
        }
        </style>
    </head>
    <body>
        <h3 id="title">
            <span id="title-main">{{.Title}}</span> &rArr; <span class="status" id="dest">{{.Dest}}</span>
            <span class="subtitle" id="raw_title">{{.RawTitle}} &rarr; <span id="full_dest">{{.FullDest}}</span></span>
        </h3>
        <span id="updated">{{.Updated}}</span><br>
        Phase: <strong class="status" id="phase">{{.Phase}}</strong><br>
        Elapsed: <span class="status" id="elapsed">{{.ElapsedSeconds}}</span><br>
        PID: <span id="run_pid">{{.RunPID}}</span>
        <span style="text-indent: 45px" class="subtitle" id="mkv_pid">({{.MKVPID}})</span>

        <div><br>Rip progress:
        <div class="bar">
            <div class="bar-fill rip"></div>
            <div class="bar-overflow rip-overflow"></div>
            <span class="bar-text rip-text">{{.CurrentRipMB}} MB / {{.TotalRipMB}} MB ({{.RipPercent}}%)</span>
        </div>

        Move progress:
        <div class="bar">
            <div class="bar-fill move"></div>
            <div class="bar-overflow move-overflow"></div>
            <span class="bar-text move-text">{{.CurrentMvMB}} MB / {{.TotalMvMB}} MB ({{.MovePercent}}%)</span>
        </div></div>


        <script>
        function fmtElapsed(s) {
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function fmtDate(iso) {
            const d = new Date(iso);
            return d.toLocaleString('en-US', {
                month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit',
                hour12: true,
            });
        }

        function setBar(prefix, cur, total) {
            const pct = total ? (cur * 100 / total) : 0;
            const fill = document.querySelector(`.bar-fill.${prefix}`);
            const overflow = document.querySelector(`.bar-overflow.${prefix}-overflow`);
            const text = document.querySelector(`.${prefix}-text`);

            fill.style.width = Math.min(100, pct) + '%';
            overflow.style.width = Math.max(0, pct - 100) + '%';
            text.textContent = `${cur} MB / ${total} MB (${Math.floor(pct)}%)`;
        }

        async function tick() {
            try {
                const s = await (await fetch('/json')).json();

                document.getElementById('title-main').textContent = s.title;
                document.getElementById('raw_title').textContent = s.raw_title;
                document.getElementById('phase').textContent = s.phase;
                document.getElementById('dest').textContent = s.dest;
                document.getElementById('full_dest').textContent = s.full_dest;
                document.getElementById('elapsed').textContent = fmtElapsed(s.elapsed_seconds);
                document.getElementById('updated').textContent = fmtDate(s.updated);
                document.getElementById('run_pid').textContent = s.run_pid
                document.getElementById('mkv_pid').textContent = s.mkv_pid

                setBar('rip', s.cur_rip_mb, s.total_rip_mb);
                setBar('move', s.cur_mv_mb, s.total_mv_mb);
            } catch (e) { console.error('tick failed:', e); }
        }
        setInterval(tick, 1000);
        </script>
    </body>
</html>
