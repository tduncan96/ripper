<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rip Status</title>
        <style>
        body {
            margin: 0;
            padding: 1rem;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            line-height: 1.4;
        }
        .bar {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 22px;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            overflow: hidden;
            margin: 4px 0 12px 0;
        }
        .bar-fill {
            height: 100%;
            background: #4ade80;
            transition: width 0.5s ease;
        }
        .bar-fill.move {
            background: #60a5fa;
        }
        .bar-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 0 0 2px #000;
            font-size: 12px;
        }
        </style>
    </head>
    <body>
        <h3 id="title">{{.Title}}</h3>
        <span id="updated">{{.Updated}}</span><br>
        Phase: <strong id="phase">{{.Phase}}</strong><br>
        Destination: <span id="dest">{{.Destination}}</span><br>
        Elapsed: <span id="elapsed">{{.ElapsedSeconds}}</span>

        <p>Rip progress:<br>
        <div class="bar">
            <div class="bar-fill rip" style="width: {{.RipPercent}}%"></div>
            <span class="bar-text rip-text">{{.CurrentRipMB}} MB / {{.TotalMB}} MB ({{.RipPercent}}%)</span>
        </div></p>

        <p>Move progress:<br>
        <div class="bar">
            <div class="bar-fill move" style="width: {{.MovePercent}}%"></div>
            <span class="bar-text move-text">{{.CurrentMvMB}} MB / {{.TotalMB}} MB ({{.MovePercent}}%)</span>
        </div></p>


        <script>
        function fmtElapsed(s) {
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function fmtDate(iso) {
            const d = new Date(iso);
            return d.toLocaleString('en-US', {
                month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false,
            });
        }

        async function tick() {
            try {
                const s = await (await fetch('/json')).json();
                const pct = (a, b) => b ? Math.floor(a * 100 / b) : 0;

                document.getElementById('title').textContent = s.title;
                document.getElementById('phase').textContent = s.phase;
                document.getElementById('dest').textContent = s.destination;
                document.getElementById('elapsed').textContent = fmtElapsed(s.elapsed_seconds);
                document.getElementById('updated').textContent = fmtDate(s.updated);

                const ripPct = pct(s.cur_rip_mb, s.total_mb);
                document.querySelector('.bar-fill.rip').style.width = ripPct + '%';
                document.querySelector('.rip-text').textContent =
                    `${s.cur_rip_mb} / ${s.total_mb} MB (${ripPct}%)`;

                const mvPct = pct(s.cur_mv_mb, s.total_mb);
                document.querySelector('.bar-fill.move').style.width = mvPct + '%';
                document.querySelector('.move-text').textContent =
                    `${s.cur_mv_mb} / ${s.total_mb} MB (${mvPct}%)`;
            } catch (e) { /* ignore, try again */ }
        }
        setInterval(tick, 1000);
        </script>
    </body>
</html>
