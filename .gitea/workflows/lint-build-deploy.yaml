name: Build and Deploy ripper

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: golang:1.26-alpine
    steps:
      - name: Install deps
        run: apk add --no-cache git shellcheck

      - name: Clone repo
        run: |
          git -c http.sslVerify=false clone http://192.168.0.99:3000/tduncan/ripper.git .
          git checkout "$GITHUB_SHA"

      - name: Go linting and security checks
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          go vet ./...
          staticcheck ./...
          gosec ./...
          govulncheck ./...

      - name: Shellcheck scripts
        run: git ls-files '*.sh' | xargs -r shellcheck

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: golang:1.26-alpine
    steps:
      - name: Install deps
        run: apk add --no-cache git openssh-client

      - name: Clone repo
        run: |
          git -c http.sslVerify=false clone http://192.168.0.99:3000/tduncan/ripper.git .
          git checkout "$GITHUB_SHA"

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o ripper .

      - name: Deploy
        env:
          SATURN_SVC_SSH_KEY: ${{ secrets.SATURN_SVC_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SATURN_SVC_SSH_KEY" | ssh-add -
          scp -o StrictHostKeyChecking=no ripper saturn-svc@192.168.0.99:/tmp/ripper
          scp -o StrictHostKeyChecking=no \
            scripts/media-ripper.sh scripts/media-librarian.sh systemd/ripper.service \
            saturn-svc@192.168.0.99:/tmp/
          ssh -o StrictHostKeyChecking=no saturn-svc@192.168.0.99 '
            sudo -n install -d /usr/local/libexec &&
            sudo -n install -m 0755 /tmp/media-ripper.sh /usr/local/libexec/media-ripper.sh &&
            sudo -n install -m 0755 /tmp/media-librarian.sh /usr/local/libexec/media-librarian.sh &&
            sudo -n install -m 0755 /tmp/ripper /usr/local/bin/ripper &&
            sudo -n install -m 0644 /tmp/ripper.service /etc/systemd/system/ripper.service &&
            sudo systemctl daemon-reload &&
            sudo systemctl enable ripper &&
            sudo systemctl restart ripper &&
            sleep 2 &&
            systemctl is-active --quiet ripper
          '