<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Ripper logo">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#0eb64c"/>
    </linearGradient>
  </defs>

  <!-- optical disc -->
  <circle cx="50" cy="64" r="44" fill="#1e1e1e" stroke="url(#disc)" stroke-width="6"/>
  <circle cx="50" cy="64" r="33" fill="none" stroke="url(#disc)" stroke-width="2" opacity="0.5"/>
  <circle cx="50" cy="64" r="25" fill="none" stroke="url(#disc)" stroke-width="2" opacity="0.35"/>

  <!-- hub -->
  <circle cx="50" cy="64" r="12" fill="#1e1e1e" stroke="url(#disc)" stroke-width="4"/>
  <circle cx="50" cy="64" r="3.5" fill="#d4d4d4"/>

  <!-- rip / extract arrow pulling content off the disc -->
  <path d="M100 64 h16 M109 55 l9 9 -9 9" fill="none" stroke="#f87171" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
